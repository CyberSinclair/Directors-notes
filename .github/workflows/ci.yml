# Copied from CyberSinclair/ci-workflows (templates/ci-node.yml).
# The real work happens in the shared reusable workflows; this file only
# decides when they run and passes project settings.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly run to catch newly published vulnerabilities in unchanged code.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Quality & tests
    uses: CyberSinclair/ci-workflows/.github/workflows/node-ci.yml@6d1d3aad8198940cb37571c47826ac1ba71a9547 # v1.0.0
    with:
      working-directory: app

  security:
    name: Security
    uses: CyberSinclair/ci-workflows/.github/workflows/security.yml@6d1d3aad8198940cb37571c47826ac1ba71a9547 # v1.0.0
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      working-directory: app
      codeql-languages: '["javascript-typescript", "actions"]'
